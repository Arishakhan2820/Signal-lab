[project]
name = "edu-ml-backend"
version = "0.1.0"
description = "Educational ML-learning project: secure FastAPI backend (synthetic data only, not a medical tool)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "redis>=5.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.20", "uvicorn>=0.29"]
ml = ["pandas", "scikit-learn"]
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
